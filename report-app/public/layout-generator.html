<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bravo Layout Generator</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,sans-serif;background:#0f0f0f;color:#e0e0e0;height:100vh;overflow:hidden}.hd{background:linear-gradient(135deg,#1a237e,#0d47a1);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px}.hd h1{font-size:18px}.hd .sub{font-size:12px;opacity:.7}.hd nav{margin-left:auto;display:flex;gap:8px}.hd nav a{color:rgba(255,255,255,.7);text-decoration:none;padding:6px 14px;border-radius:6px;font-size:13px}.hd nav a:hover,.hd nav a.act{background:rgba(255,255,255,.15);color:#fff}.mn{display:flex;height:calc(100vh - 52px)}.sb{width:300px;background:#1a1a1a;border-right:1px solid #333;display:flex;flex-direction:column}.sb-hd{padding:16px;border-bottom:1px solid #333}.sb-hd h3{font-size:14px;color:#7c8aff;margin-bottom:10px}.srch{width:100%;padding:10px 14px;border:1px solid #444;border-radius:8px;font-size:13px;background:#2a2a2a;color:#fff;outline:none}.srch:focus{border-color:#7c8aff}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}.chip{padding:3px 10px;border-radius:12px;font-size:11px;cursor:pointer;border:1px solid #444;background:#2a2a2a;color:#aaa}.chip:hover{background:#3a3a5a;border-color:#7c8aff}.chip.on{background:#7c8aff;color:#fff;border-color:#7c8aff}.chip .ct{font-size:10px;opacity:.6;margin-left:2px}.fl{flex:1;overflow-y:auto;padding:8px}.fg{margin-bottom:6px}.fgh{padding:6px 10px;font-size:11px;font-weight:600;color:#888;cursor:pointer}.fgh .ar{font-size:10px}.fgh.cl .ar{transform:rotate(-90deg)}.fgi{overflow:hidden}.fgi.cl{display:none}.fi{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;border:1px solid transparent;margin-bottom:2px}.fi:hover{background:#2a2a4a;border-color:#555}.fi.on{background:#7c8aff;color:#fff;border-color:#7c8aff}.fi .bd{font-size:10px;padding:1px 6px;border-radius:8px;background:#333;color:#aaa;margin-left:auto}.fi.on .bd{background:rgba(255,255,255,.2);color:#fff}.ct2{flex:1;display:flex;flex-direction:column;overflow:hidden}.ct-hd{padding:16px 24px;background:#1a1a1a;border-bottom:1px solid #333;display:flex;align-items:center;gap:16px}.ct-hd h2{font-size:16px;color:#7c8aff}.ct-hd .fi2{font-size:12px;color:#888}.btn{padding:8px 18px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}.bp{background:#7c8aff;color:#fff}.bp:hover{background:#6c7aef}.ct-bd{flex:1;overflow-y:auto;padding:20px 24px}.cd{background:#1e1e1e;border-radius:10px;border:1px solid #333;margin-bottom:16px}.cd-h{padding:14px 18px;border-bottom:1px solid #333;display:flex;align-items:center;gap:10px}.cd-h h3{font-size:14px;color:#7c8aff;flex:1}.cd-b{padding:16px 18px}.tc{border:1px solid #333;border-radius:8px;margin-bottom:8px}.tc-h{background:linear-gradient(135deg,#1a1a3a,#2a2a2a);padding:10px 14px;font-weight:600;font-size:13px;color:#aaa}.lt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.lt span{padding:4px 12px;background:#1a2a4a;color:#7c8aff;border-radius:12px;font-size:12px}.fl2{list-style:none}.fl2 li{padding:6px 10px;background:#2a2a1a;border-left:3px solid #f59e0b;margin-bottom:4px;border-radius:0 4px 4px 0;font-size:12px;font-family:Consolas,monospace;word-break:break-all;color:#ccc}.es{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#666;text-align:center;padding:40px}.es h3{font-size:18px;margin-bottom:8px;color:#888}.es p{font-size:13px;max-width:400px;line-height:1.6}.op{width:420px;background:#111;color:#d4d4d4;display:flex;flex-direction:column;border-left:1px solid #333}.ots{display:flex;background:#1a1a1a;border-bottom:1px solid #333}.ot{padding:10px 18px;font-size:12px;cursor:pointer;color:#666;border-bottom:2px solid transparent;user-select:none}.ot:hover{color:#ccc;background:#222}.ot.on{color:#7c8aff;border-bottom-color:#7c8aff;background:#111}.oa{padding:8px 12px;background:#1a1a1a;border-bottom:1px solid #333;display:flex;gap:8px;align-items:center}.oa .btn{font-size:11px;padding:4px 10px;color:#7c8aff;border:1px solid #7c8aff;background:transparent}.oa .btn:hover{background:#7c8aff;color:#fff}.cc{flex:1;overflow:auto;padding:16px}.cb{font-family:Consolas,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all}.kw{color:#569cd6}.str{color:#ce9178}.tg{color:#569cd6}.at{color:#92d47a}.vl{color:#ce9178}.cm{color:#6a9955}.ld{display:flex;align-items:center;gap:8px;color:#888;padding:20px}.sp{width:20px;height:20px;border:2px solid #333;border-top-color:#7c8aff;border-radius:50%;animation:spn .8s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}.st{padding:8px 16px;background:#1a1a1a;border-top:1px solid #333;font-size:11px;color:#666;display:flex;gap:16px}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#444;border-radius:3px}</style></head><body><div class="hd"><div><h1>Bravo Layout Generator</h1><div class="sub">Tu dong sinh SQL, Layout XML, DataSource XML</div></div><nav><a href="/">Dashboard</a><a href="/layout-generator.html" class="act">Layout Generator</a></nav></div><div class="mn"><div class="sb"><div class="sb-hd"><h3>Forms (<span id="tf">0</span>)</h3><input type="text" class="srch" id="si" placeholder="Tim kiem form..."><div class="chips" id="cf"></div></div><div class="fl" id="fl"></div><div class="st"><span>Cats: <strong id="tc2">0</strong></span><span>Forms: <strong id="tf2">0</strong></span></div></div><div class="ct2"><div class="ct-hd" id="chd" style="display:none"><h2 id="ft">-</h2><span class="fi2" id="fi2">-</span><div style="margin-left:auto;display:flex;gap:8px"><button class="btn bp" onclick="gen()">Generate All</button></div></div><div class="ct-bd" id="cbd"><div class="es"><h3>Chon mot form de bat dau</h3><p>Tim kiem va chon form ben trai de xem cau truc va tao code.</p></div></div></div><div class="op"><div class="ots"><div class="ot on" data-t="sql" onclick="stab("sql")">SQL Scripts</div><div class="ot" data-t="layout" onclick="stab("layout")">Layout XML</div><div class="ot" data-t="ds" onclick="stab("ds")">DataSource</div></div><div class="oa"><button class="btn" onclick="copy()">Copy</button><button class="btn" onclick="dl()">Download</button><span style="flex:1"></span><span id="oi2" style="font-size:11px;color:#666"></span></div><div class="cc"><div class="cb" id="co"><span class="cm">-- Chon form va nhan Generate All</span></div></div></div></div><script>const A="";let af={},cf=null,cc=null,gd={},at="sql";document.addEventListener("DOMContentLoaded",lf);async function lf(){try{const r=await fetch(A+"/api/layout-forms");af=await r.json();rc();rf();}catch(e){console.error(e);}}function rc(){const cs=Object.keys(af).sort();const c=document.getElementById("cf");c.innerHTML="<div class=\"chip on\" onclick=\"fcat(null)\">All<span class=\"ct\">"+Object.values(af).reduce((s,a)=>s+a.length,0)+"</span></div>";cs.forEach(cat=>{const ch=document.createElement("div");ch.className="chip";ch.dataset.cat=cat;ch.innerHTML=cat+"<span class=\"ct\">"+af[cat].length+"</span>";ch.onclick=()=>fcat(cat);c.appendChild(ch);});document.getElementById("tc2").textContent=cs.length;document.getElementById("tf2").textContent=Object.values(af).reduce((s,a)=>s+a.length,0);}function fcat(cat){cc=cat;document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));if(cat){document.querySelector(".chip[data-cat=\""+cat+"\"]").classList.add("on");}else{document.querySelector(".chip").classList.add("on");}rf();}function rf(){const q=document.getElementById("si").value.toLowerCase();const c=document.getElementById("fl");c.innerHTML="";let t=0;const cs=cc?[cc]:Object.keys(af).sort();cs.forEach(cat=>{const forms=(af[cat]||[]).filter(f=>!q||f.formName.toLowerCase().includes(q));if(!forms.length)return;t+=forms.length;const g=document.createElement("div");g.className="fg";g.innerHTML="<div class=\"fgh\" onclick=\"tg2(this)\"><span class=\"ar\">&#9660;</span> "+cat+" ("+forms.length+")</div><div class=\"fgi\"></div>";const items=g.querySelector(".fgi");forms.forEach(f=>{const it=document.createElement("div");it.className="fi"+(cf===f.formName?" on":"");it.innerHTML="<span>"+f.formName+"</span><span class=\"bd\">"+f.layouts.length+"</span>";it.onclick=()=>sf(f.formName);items.appendChild(it);});c.appendChild(g);});document.getElementById("tf").textContent=t;}function tg2(h){h.classList.toggle("cl");h.nextElementSibling.classList.toggle("cl")}document.getElementById("si").addEventListener("input",rf);async function sf(fn){cf=fn;document.querySelectorAll(".fi").forEach(i=>i.classList.remove("on"));if(event&&event.target){const ti=event.target.closest(".fi");if(ti)ti.classList.add("on")}document.getElementById("chd").style.display="flex";document.getElementById("ft").textContent=fn;const b=document.getElementById("cbd");b.innerHTML="<div class=\"ld\"><div class=\"sp\"></div> Dang tai...</div>";try{const r=await fetch(A+"/api/layout-parse/"+encodeURIComponent(fn));const d=await r.json();document.getElementById("fi2").textContent="Tables: "+d.tables.length+" | Sources: "+d.sources.length+" | Lookups: "+d.lookups.length+" | XML: "+(d.xmlLength/1024).toFixed(1)+"KB";rp(d)}catch(e){b.innerHTML="<div class=\"es\"><h3>Loi</h3><p>"+e.message+"</p></div>"}}function rp(d){const b=document.getElementById("cbd");let h="";h+="<div class=\"cd\"><div class=\"cd-h\"><h3>Tables ("+d.tables.length+")</h3></div><div class=\"cd-b\">";d.tables.forEach(t=>{h+="<div class=\"tc\"><div class=\"tc-h\">Table: "+t+"</div></div>"});if(!d.tables.length)h+="<p style=\"color:#666\">Khong tim thay</p>";h+="</div></div>";h+="<div class=\"cd\"><div class=\"cd-h\"><h3>DataMembers ("+d.dataMembers.length+")</h3></div><div class=\"cd-b\">";d.dataMembers.forEach(dm=>{h+="<div class=\"tc\"><div class=\"tc-h\">View: "+dm+"</div></div>"});if(!d.dataMembers.length)h+="<p style=\"color:#666\">Khong tim thay</p>";h+="</div></div>";h+="<div class=\"cd\"><div class=\"cd-h\"><h3>Sources ("+d.sources.length+")</h3></div><div class=\"cd-b\">";d.sources.forEach(s=>{h+="<div class=\"tc\"><div class=\"tc-h\">Source: "+s+"</div></div>"});if(!d.sources.length)h+="<p style=\"color:#666\">Khong tim thay</p>";h+="</div></div>";h+="<div class=\"cd\"><div class=\"cd-h\"><h3>Lookups ("+d.lookups.length+")</h3></div><div class=\"cd-b\"><div class=\"lt\">";d.lookups.forEach(l=>{h+="<span>"+l+"</span>"});if(!d.lookups.length)h+="<p style=\"color:#666\">Khong tim thay</p>";h+="</div></div></div>";h+="<div class=\"cd\"><div class=\"cd-h\"><h3>Filters ("+d.filters.length+")</h3></div><div class=\"cd-b\"><ul class=\"fl2\">";d.filters.forEach(f=>{h+="<li>"+esc(f)+"</li>"});if(!d.filters.length)h+="<p style=\"color:#666\">Khong tim thay</p>";h+="</ul></div></div>";b.innerHTML=h}async function gen(){if(!cf)return;const b=document.getElementById("cbd");b.innerHTML="<div class=\"ld\"><div class=\"sp\"></div> Dang generate...</div>";try{const r=await fetch(A+"/api/layout-generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({formName:cf,tableName:cf})});gd=await r.json();sf(cf);stab(at)}catch(e){b.innerHTML="<div class=\"es\"><h3>Loi</h3><p>"+e.message+"</p></div>"}}function stab(t){at=t;document.querySelectorAll(".ot").forEach(e=>e.classList.remove("on"));document.querySelector(".ot[data-t=\""+t+"\"]").classList.add("on");const co=document.getElementById("co");const oi=document.getElementById("oi2");if(t==="sql"&&gd.createSQL){co.innerHTML=hlS(gd.createSQL);oi.textContent=gd.createSQL.length+" chars"}else if(t==="layout"&&gd.layoutXml){co.innerHTML=hlX(gd.layoutXml);oi.textContent=gd.layoutXml.length+" chars"}else if(t==="ds"&&gd.dataSourceXml){co.innerHTML=hlX(gd.dataSourceXml);oi.textContent=gd.dataSourceXml.length+" chars"}else{co.innerHTML="<span class=\"cm\">-- Chon form va nhan Generate All</span>";oi.textContent=""}}function hlS(s){return esc(s).replace(/(CREATE|TABLE|INT|VARCHAR|NVARCHAR|DATE|DATETIME|BIT|TINYINT|IDENTITY|PRIMARY|KEY|DEFAULT|GETDATE|NOT|NULL|PROCEDURE|VIEW|INDEX|DROP|IF|EXISTS|SELECT|FROM|WHERE|LEFT|JOIN|ORDER|BY|DESC|ASC|INSERT|INTO|VALUES|UPDATE|SET|AND|OR|ALTER|ADD|CONSTRAINT|FOREIGN|REFERENCES|GO|AS|BEGIN|END|NOCOUNT|ON|OFF|IDENTITY_INSERT|ISNULL|SCOPE_IDENTITY|LIKE)/gi,"<span class=\"kw\"></span>")function hlX(s){return esc(s).replace(/&lt;(/?)([w:-]+)/g,"&lt;<span class=\"tg\"></span>").replace(/([w:-]+)=(&quot;|")/g,"<span class=\"at\"></span>=<span class=\"vl\"></span>")}function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}function copy(){const c=document.getElementById("co").textContent;navigator.clipboard.writeText(c).then(()=>{const b=event.target;b.textContent="Copied!";setTimeout(()=>b.textContent="Copy",1500)})}function dl(){const c=document.getElementById("co").textContent;const e=at==="sql"?"sql":"xml";const bl=new Blob([c],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=(cf||"output")+"."+e;a.click()}</script></body></html>
